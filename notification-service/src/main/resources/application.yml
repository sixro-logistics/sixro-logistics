server:
  port: 19099

gemini:
  api-key: ${GEMINI_API_KEY:dummy-gemini-key}
  url: https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  cloud:
    discovery:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  instance:
    # 개발환경
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    # 운영환경 prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
    # 로컬 단일 인스턴스에서 확인하기 쉬운 고정 ID
    instance-id: ${spring.application.name}:${server.port}

  client:
    # notification Service를 Eureka Server에 등록
    register-with-eureka: true
    # Eureka Registry에서 다른 서비스 목록 조회
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:19090/eureka/}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
    zipkin:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.boot.context.config: DEBUG
  pattern:
    console: '%clr(%-5level){green} [traceId=%X{traceId:-}, spanId=%X{spanId:-}] %clr(%logger{36}){cyan}: %msg%n'

outbox:
  publisher:
    fixed-delay: 1000

slack:
  bot-token: ${SLACK_BOT_TOKEN:dummy-slack-token}
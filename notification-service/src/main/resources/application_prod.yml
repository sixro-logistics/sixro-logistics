server:
  port: 19099

gemini:
  api-key: ${GEMINI_API_KEY}
  url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

spring:
  application:
    name: notification-service

  datasource:
    url: ${NOTI_DB_URL}
    username: ${NOTI_DB_USERNAME}
    password: ${NOTI_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 운영 환경에서는 테이블 구조가 실수로 변경되는 것을 방지하기 위해 validate 사용
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        # notification-service 전용 스키마 지정
        default_schema: notification_schema

  kafka:
    # 운영 환경에서는 로컬 기본값 없이 환경 변수로만 주입받도록 설정
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  cloud:
    discovery:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

eureka:
  instance:
    # 운영 환경에서는 스프링이 실제 네트워크 IP를 유연하게 자동 감지하도록 설정
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      # 운영 환경 Eureka 서버 주소 (실수 누락 방지를 위해 기본값 제거)[cite: 8]
      defaultZone: ${EUREKA_SERVER_URL}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
    zipkin:
      # 운영 환경 Zipkin 서버 주소 (기본값 제거)
      endpoint: ${ZIPKIN_ENDPOINT}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    # notification 패키지 로깅 레벨 명시
    com.sixro.logistics.notification: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5level){green} [${spring.application.name:unknown-service}] [traceId=%X{traceId:-}, spanId=%X{spanId:-}] [%thread] %logger{36} - %msg%n'

outbox:
  publisher:
    fixed-delay: 1000

slack:
  bot-token: ${SLACK_BOT_TOKEN}
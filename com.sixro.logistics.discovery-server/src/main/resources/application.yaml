server:
  # Discovery Server 실행 포트
  port: 19090

spring:
  application:
    # Eureka에 등록되는 서비스 이름
    name: discovery-server

eureka:
  instance:
    # Discovery Server 호스트 이름
    hostname: localhost

  client:
    # 자기 자신을 Eureka에 등록하지 않음
    register-with-eureka: false

    # 다른 Eureka Server의 Registry를 조회하지 않음
    # (단일 Discovery Server 환경)
    fetch-registry: false

    # Eureka Server 주소
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

management:
  endpoints:
    web:
      exposure:
        # 외부에서 조회 가능한 Actuator Endpoint
        include: health, info

  endpoint:
    health:
      # Health Endpoint 상세 정보 표시
      show-details: always
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # 테스트 JWT의 RS256 서명 검증에 사용하는 공개키
          public-key-location: classpath:keys/test-public-key.pem

  cloud:
    # 테스트에서는 Eureka와 서비스 탐색을 사용하지 않음
    discovery:
      enabled: false

    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  # 테스트 결과를 외부 Zipkin으로 전송하지 않음
  tracing:
    enabled: false
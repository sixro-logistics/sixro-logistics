server:
  # API Gateway 실행 포트
  port: 19091

spring:
  config:
    # 프로젝트 루트의 .env 파일을 불러옵니다.
    import: "optional:file:../.env[.properties]"
  application:
    # Eureka에 등록되는 서비스 이름
    name: gateway-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          # RS256 Access Token 검증에 사용할 PEM 공개키 위치
          public-key-location: file:${JWT_PUBLIC_KEY_PATH}

  reactor:
    context-propagation: auto

  cloud:
    gateway:
      server:
        webflux:
          # Gateway 요청 처리 메트릭 수집
          metrics:
            enabled: true

          # Eureka 등록 서비스 자동 노출 대신 명시적 Route만 사용
          discovery:
            locator:
              enabled: false

          # Timeout 적용
          httpclient:
            connect-timeout: 3000
            response-timeout: 5s

          # lb:// Load Balancer를 통해 Eureka에서 ABC-service를 찾습니다.
          routes:
            # MASTER 관리자 사용자 생성, 기존 회원가입과 별도 구현
            # 비밀번호 암호화를 위해 Auth Service로 전달
            - id: auth-admin-user-create
              order: -10
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/users
                - Method=POST

            # Auth
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth,/api/v1/auth/**

            # User
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users,/api/v1/users/**

            # Company
            - id: company-service
              uri: lb://company-service
              predicates:
                - Path=/api/v1/companies,/api/v1/companies/**

            # Product
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products,/api/v1/products/**

            # Order
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders,/api/v1/orders/**

            # Inventory
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/inventories,/api/v1/inventories/**

            # Delivery
            - id: delivery-service-deliveries
              uri: lb://delivery-service
              predicates:
                - Path=/api/v1/deliveries,/api/v1/deliveries/**

            - id: delivery-service-delivery-routes
              uri: lb://delivery-service
              predicates:
                - Path=/api/v1/delivery-routes,/api/v1/delivery-routes/**

            - id: delivery-service-delivery-managers
              uri: lb://delivery-service
              predicates:
                - Path=/api/v1/delivery-managers,/api/v1/delivery-managers/**

            # Hub
            - id: hub-service-hubs
              uri: lb://hub-service
              predicates:
                - Path=/api/v1/hubs,/api/v1/hubs/**

            - id: hub-service-hub-routes
              uri: lb://hub-service
              predicates:
                - Path=/api/v1/hub-routes,/api/v1/hub-routes/**

            # Notification / Slack
            - id: notification-service-slack
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/slack/messages,/api/v1/slack/messages/**

            # Notification / AI
            - id: notification-service-ai
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/ai,/api/v1/ai/**

eureka:
  instance:
    # 개발환경
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    # 운영환경
    #    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
    instance-id: ${spring.application.name}:${server.port}

  client:
    # Gateway를 Eureka Server에 등록
    register-with-eureka: true

    # Eureka Registry에서 다른 서비스 목록 조회
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:19090/eureka/}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          # 개발 중 Route 확인이 필요하면 임시 활성화
#          - gateway

  endpoint:
    health:
      # 개발환경
      show-details: always
      # 운영환경
  #      show-details: when_authorized

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    root: INFO
    com.sixro.logistics.gateway: INFO

  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5level){green} [${spring.application.name:unknown-service}] [traceId=%X{traceId:-}, spanId=%X{spanId:-}] [%thread] %logger{36} - %msg%n'
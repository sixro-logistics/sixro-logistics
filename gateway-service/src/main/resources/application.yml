server:
  # API Gateway 실행 포트
  port: 19091

spring:
  application:
    # Eureka에 등록되는 서비스 이름
    name: gateway-service

  cloud:
    gateway:
      discovery:
        locator:
          # Eureka에 등록된 서비스 정보를 기반으로 라우팅 활성화
          enabled: true

          # Eureka가 서비스 ID를 대문자로 관리해도
          # /user-service/** 같은 소문자 경로 사용 가능
          lower-case-service-id: true

eureka:
  client:
    # Gateway를 Eureka Server에 등록
    register-with-eureka: true

    # Eureka Registry에서 다른 서비스 목록 조회
    fetch-registry: true

    service-url:
      # 프로젝트에서 사용하는 Discovery Server 주소
      defaultZone: http://localhost:19090/eureka/

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      # 개발 환경에서 Health 상세 정보 표시
      show-details: always
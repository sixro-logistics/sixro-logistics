server:
  port: 19094

spring:
  application:
    name: company-service
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"

  datasource:
    url: ${USER_DB_URL}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

eureka:
  instance:
    prefer-ip-address: true # 호스트 이름 대신 IP 주소로 Eureka에 등록
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}} # 고유 인스턴스 ID 설정
    hostname: localhost

  client:
    register-with-eureka: true
    fetch-registry: true
    # Eureka Server 주소
    service-url:
      defaultZone: http://${eureka.instance.hostname}:19090/eureka/

management:
  endpoints:
    web:
      exposure:
        # HTTP로 노출할 Actuator Endpoint
        include: health, info

  endpoint:
    health:
      # Health Endpoint 상세 정보 표시
      # 운영 환경에서는 when-authorized 또는 never 권장
      show-details: always
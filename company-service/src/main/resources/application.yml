server:
  port: 19094

spring:
  application:
    name: company-service
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
cloud:
  discovery:
    enabled: true

eureka:
  instance:
    # 개발환경
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    # 운영환경
    #    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
    # 로컬 단일 인스턴스에서 확인하기 쉬운 고정 ID
    instance-id: ${spring.application.name}:${server.port}

  client:
    # User Service를 Eureka Server에 등록
    register-with-eureka: true

    # Eureka Registry에서 다른 서비스 목록 조회
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:19090/eureka/}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.sixro.logistics.user: INFO

  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5level){green} [${spring.application.name:unknown-service}] [traceId=%X{traceId:-}, spanId=%X{spanId:-}] [%thread] %logger{36} - %msg%n'

outbox:
  publisher:
    fixed-delay: 1000
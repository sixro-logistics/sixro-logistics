spring:
  data:
    redis:
      host: localhost
      port: 6379
      username:
      password:

  kafka:
    # 테스트에서 Kafka Consumer가 실제 Broker에 연결하지 않도록 설정
    listener:
      auto-startup: false

  cloud:
    # 테스트에서는 Eureka 서비스 탐색을 사용하지 않음
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  issuer: auth-service
  private-key-path: src/test/resources/keys/test-private-key.pem
  public-key-path: src/test/resources/keys/test-public-key.pem
  access-token-expiration: 30m
  refresh-token-expiration: 8h

management:
  # 테스트 결과를 외부 Zipkin으로 전송하지 않음
  tracing:
    enabled: false
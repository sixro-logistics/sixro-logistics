spring:
  data:
    redis:
      # Docker 내부 Redis 서비스명 또는 AWS ElastiCache Endpoint
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}

  kafka:
    # Docker 내부 Kafka 서비스명 또는 운영 Kafka Broker 주소
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  cloud:
    discovery:
      enabled: true

eureka:
  instance:
    # AWS Docker 환경에서는 127.0.0.1로 등록하지 않습니다.
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:auth-service}

    # 여러 인스턴스가 실행될 가능성을 고려하여 hostname을 포함합니다.
    instance-id: ${spring.application.name}:${HOSTNAME:${random.value}}

  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

jwt:
  issuer: auth-service

  # 컨테이너에 읽기 전용으로 마운트한 RSA Key 경로를 전달합니다.
  private-key-path: ${JWT_PRIVATE_KEY_PATH}
  public-key-path: ${JWT_PUBLIC_KEY_PATH}

  access-token-expiration: 30m
  refresh-token-expiration: 8h

management:
  endpoints:
    web:
      exposure:
        # 운영 환경에서는 필요한 Endpoint만 노출합니다.
        include:
          - health
          - info

  endpoint:
    health:
      show-details: when_authorized

  tracing:
    sampling:
      # 운영 환경에서는 전체 요청을 수집하지 않도록 조절합니다.
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

logging:
  level:
    root: INFO
    com.sixro.logistics.auth: INFO
server:
  # Auth Service 실행 포트
  port: 19092

spring:
  application:
    # Eureka에 등록되는 서비스 이름
    # Gateway의 lb://auth-service와 반드시 일치해야 합니다.
    name: auth-service

  config:
    # auth-service 디렉터리를 실행 경로로 사용할 경우
    # 프로젝트 루트의 .env 파일을 불러옵니다.
    import: "optional:file:../.env[.properties]"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: auth-user-security
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  cloud:
    discovery:
      enabled: true

    # User Service 내부 API 호출 Timeout
    openfeign:
      client:
        config:
          authUserServiceClient:
            connect-timeout: 2000
            read-timeout: 3000

eureka:
  instance:
    # 개발환경
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    # 운영환경
#    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
    # 로컬 단일 인스턴스에서 확인하기 쉬운 고정 ID
    instance-id: ${spring.application.name}:${server.port}

  client:
    # Auth Service를 Eureka Server에 등록
    register-with-eureka: true
    # Eureka Registry에서 다른 서비스 목록 조회
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:19090/eureka/}

jwt:
  issuer: auth-service
  private-key-path: ${JWT_PRIVATE_KEY_PATH}
  public-key-path: ${JWT_PUBLIC_KEY_PATH}
  access-token-expiration: 30m
  refresh-token-expiration: 8h

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - circuitbreakers
          - circuitbreakerevents

  endpoint:
    health:
      # 개발환경
      show-details: always
      # 운영환경
  #      show-details: when_authorized

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.sixro.logistics.auth: INFO

  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5level){green} [${spring.application.name:unknown-service}] [traceId=%X{traceId:-}, spanId=%X{spanId:-}] [%thread] %logger{36} - %msg%n'

# Auth Service에서 User Service의 인증 정보 조회 호출에 적용합니다.
#
# 사용자 생성 POST 요청은 조회용 Circuit Breaker 대상에서 제외하며,
# 자동 Retry를 적용하지 않습니다.
# 장애 발생 시 가짜 사용자 정보를 반환하는 fallback도 사용하지 않습니다.
resilience4j:
  circuitbreaker:
    instances:
      authUserService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.sixro.logistics.auth.infrastructure.client.config.AuthUserServiceFailurePredicate
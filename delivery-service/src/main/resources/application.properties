spring.application.name=delivery-service
server.port=19097

eureka.client.service-url.defaultZone= http://localhost:19090/eureka/

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${USER_DB_URL}
spring.datasource.username=${USER_DB_USERNAME}
spring.datasource.password=${USER_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.instance.prefer-ip-address=true

management.tracing.export.zipkin.enabled=false

spring.cloud.openfeign.client.config.user-service.loggerLevel=FULL
logging.level.com.sixro.logistics.delivery.infrastructure.client.user.UserClient=DEBUG

# Kafka Consumer
spring.kafka.bootstrap-servers=${KAFKA_SERVER_URL}
spring.kafka.consumer.group-id=delivery-service
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.sixro.logistics.delivery.infrastructure.kafka.event.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sixro.logistics.delivery.infrastructure.kafka.event
spring.kafka.listener.ack-mode=record

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

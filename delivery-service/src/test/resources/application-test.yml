spring:
  application:
    name: delivery-service

  datasource:
    url: jdbc:h2:mem:delivery_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS delivery_schema
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  cloud:
    discovery:
      enabled: false
    openfeign:
      client:
        config:
          user-service:
            logger-level: FULL

  kafka:
    bootstrap-servers: ${KAFKA_SERVER_URL:localhost:9092}

    consumer:
      group-id: delivery-service
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.sixro.logistics.delivery.infrastructure.kafka.event.OrderCreatedEvent
        spring.json.trusted.packages: com.sixro.logistics.delivery.infrastructure.kafka.event

    listener:
      ack-mode: record
      observation-enabled: true

    template:
      observation-enabled: true

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
      export:
        enabled: false

logging:
  level:
    com.sixro.logistics.delivery.infrastructure.client.user.UserClient: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5level){green} [${spring.application.name:unknown-service}] [traceId=%X{traceId:-}, spanId=%X{spanId:-}] [%thread] %logger{36} - %msg%n'

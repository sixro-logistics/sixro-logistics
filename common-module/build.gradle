plugins {
    id 'java-library'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java-test-fixtures'
}

group = 'com.sixro.logistics'
version = '0.0.1-SNAPSHOT'
description = 'com.sixro.logistics.common-module'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // CommonResponse, ErrorCode 등에서 HttpStatus 사용
    api 'org.springframework:spring-web'

    // 공통 Auto Configuration 작성에 필요한 Spring Boot API
    implementation 'org.springframework.boot:spring-boot-autoconfigure'

    // BaseEntity와 JPA Auditing에 필요한 의존성
    implementation 'org.springframework.data:spring-data-jpa'
    implementation 'jakarta.persistence:jakarta.persistence-api'

    // QueryDSL 실행
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'

    // BaseEntity의 Q 타입(QBaseEntity) 생성
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    // Auto Configuration 메타데이터 생성
    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 서블릿 API
    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Spring Boot Testcontainers 연동
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-testcontainers'

    // Testcontainers
    testFixturesImplementation 'org.testcontainers:junit-jupiter'
    testFixturesImplementation 'org.testcontainers:postgresql'
    testFixturesImplementation 'org.testcontainers:kafka'
    testFixturesImplementation 'org.testcontainers:testcontainers'
}

tasks.named('bootJar') {
    enabled = false
}

tasks.named('jar') {
    enabled = true
    archiveClassifier = ''
}

tasks.named('test') {
    useJUnitPlatform()
}


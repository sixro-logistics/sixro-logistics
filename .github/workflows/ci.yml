name: CI Pipeline

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # 다음 CI 실행 시 속도를 높이기 위해 패키지 캐싱

      # 현재 PR에서 '어떤 파일들이 수정되었는지' 목록 확인
      - name: Get changed files
        if: github.event_name == 'pull_request'
        id: changed-files
        uses: tj-actions/changed-files@v44

      # 수정된 서비스만 테스트 결정
      - name: Determine affected modules
        id: analyze
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          # 배포 직전(main 병합하는 경우)에는 안전을 위해 전체 테스트
          if [ "$EVENT_NAME" == "push" ]; then
            echo "[INFO] Main 브랜치 병합 감지: 배포 전 전체 테스트를 진행합니다."
            echo "TASKS=test" >> $GITHUB_OUTPUT
            exit 0
          fi

          RUN_ALL=false
          CHANGED_SERVICES=""

          # 수정된 파일들을 하나씩 확인
          for file in $CHANGED_FILES; do
            # 공통 모듈이나 루트 설정 파일이 바뀌었다면 전체 테스트
            if [[ "$file" == common-module/* ]] || [[ "$file" == settings.gradle ]] || [[ "$file" == build.gradle ]] || [[ "$file" == gradle/* ]]; then
              RUN_ALL=true
              break
            fi

            # 파일 경로에서 맨 앞의 서비스명만 추출 후 확인
            MODULE=$(echo "$file" | cut -d'/' -f1)

            if [ -d "$MODULE" ] && [ -f "$MODULE/build.gradle" ]; then
              CHANGED_SERVICES="$CHANGED_SERVICES $MODULE"
            fi
          done

          # 최종적으로 실행할 테스트 명령어를 조합합니다.
          if [ "$RUN_ALL" = true ]; then
            echo "[INFO] 공통 설정(common-module 등)이 변경되었습니다. 전체 모듈 테스트를 진행합니다."
            echo "TASKS=test" >> $GITHUB_OUTPUT
          else
            # 중복된 서비스 이름을 제거
            UNIQUE_SERVICES=$(echo "$CHANGED_SERVICES" | tr ' ' '\n' | sort -u | tr '\n' ' ')

            if [ -z "$UNIQUE_SERVICES" ]; then
              echo "[INFO] 백엔드 코드 변경사항이 없습니다. 테스트를 건너뜁니다."
              echo "TASKS=none" >> $GITHUB_OUTPUT
            else
              # 변경된 서비스들만 모아서 테스트 명령어를 만듭니다. (예: :user-service:test :order-service:test)
              GRADLE_TASKS=""
              for service in $UNIQUE_SERVICES; do
                GRADLE_TASKS="$GRADLE_TASKS :$service:test"
              done
              echo "[INFO] 변경된 서비스만 격리하여 테스트를 진행합니다: $GRADLE_TASKS"
              echo "TASKS=$GRADLE_TASKS" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Grant execute permission for gradlew
        if: steps.analyze.outputs.TASKS != 'none'
        run: chmod +x gradlew

      # 테스트 수행
      - name: Run Tests
        if: steps.analyze.outputs.TASKS != 'none'
        run: ./gradlew ${{ steps.analyze.outputs.TASKS }}
server:
  # User Service 실행 포트
  port: 19093

spring:
  application:
    # Eureka에 등록되는 서비스 이름
    # Gateway의 lb://user-service와 반드시 일치해야 합니다.
    name: user-service

  config:
    # user-service 디렉터리를 실행 경로로 사용할 경우
    # 프로젝트 루트의 .env 파일을 불러옵니다.
    import: "optional:file:../.env[.properties]"

  datasource:
    url: ${USER_DB_URL}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 로컬 개발 단계에서 Entity 변경사항을 DB에 반영합니다.
      # 운영 환경에서는 Flyway 등 마이그레이션 도구 사용을 검토합니다.
      ddl-auto: update
    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    # User Service에서 Kafka Consumer가 필요해질 경우 활성화합니다.
#    consumer:
#      group-id: user-service-group
#      auto-offset-reset: earliest
#      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
#      properties:
#        spring.json.trusted.packages: "*"

  cloud:
    discovery:
      enabled: true

    # Hub / Company Service 내부 API 호출 Timeout
    openfeign:
      client:
        config:
          hub-service:
            connectTimeout: 2000
            readTimeout: 3000

          company-service:
            connectTimeout: 2000
            readTimeout: 3000

eureka:
  instance:
    # 개발환경
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    # 운영환경
    #    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
    # 로컬 단일 인스턴스에서 확인하기 쉬운 고정 ID
    instance-id: ${spring.application.name}:${server.port}

  client:
    # User Service를 Eureka Server에 등록
    register-with-eureka: true

    # Eureka Registry에서 다른 서비스 목록 조회
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:19090/eureka/}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - circuitbreakers
          - circuitbreakerevents

  endpoint:
    health:
      # 개발환경
      show-details: always
      # 운영환경
#      show-details: when_authorized

  tracing:
    sampling:
      probability: 1.0
      # 운영환경에서 필요 시 환경변수 사용
#      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.sixro.logistics.user: INFO

  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5level){green} [${spring.application.name:unknown-service}] [traceId=%X{traceId:-}, spanId=%X{spanId:-}] [%thread] %logger{36} - %msg%n'

outbox:
  publisher:
    fixed-delay: 1000

# Hub / Company 소속 검증 API 재시도 정책
#
# Timeout은 spring.cloud.openfeign.client.config에서 관리하고,
# 이 영역에는 애플리케이션에서 사용하는 Retry 정책만 관리합니다.
affiliation-client:
  retry:
    initial-interval-ms: 200
    max-interval-ms: 1000
    max-attempts: 3

resilience4j:
  circuitbreaker:
    instances:
      hubAffiliation:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.sixro.logistics.user.infrastructure.client.config.AffiliationFailurePredicate

      companyAffiliation:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.sixro.logistics.user.infrastructure.client.config.AffiliationFailurePredicate